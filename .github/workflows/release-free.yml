name: Release Free edition (manual, gated)
# SOURCE -> TESTS -> BUILD -> VERSIONED ARTIFACT -> QA (Linux Chrome + Windows Edge)
# -> OWNER APPROVAL (protected environment) -> ITCH.IO UPLOAD.
#
# Deployment is DISABLED by default. The publish job only runs when ALL of these hold:
#   1. this workflow is started by hand with publish=true,
#   2. repository variable ITCH_PUBLISH_ENABLED is exactly "true",
#   3. repository variable ITCH_FREE_TARGET is set (e.g. user/new-free-project:web),
#   4. a reviewer approves the "itch-free" environment,
#   5. secret BUTLER_API_KEY exists (stored only as a GitHub Actions secret).
# Nothing runs on push. This workflow never touches the paid Pro edition.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match web/VERSION)"
        required: true
      publish:
        description: "Upload to itch.io after QA (requires approval and repo variables)"
        type: boolean
        default: false
      pro_url:
        description: "Optional Pro store URL for the 'Get Pro' button (leave empty until Pro is live)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: release-free
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$INPUT_VERSION" = "$(cat web/VERSION)" || { echo "version mismatch"; exit 1; }
      - run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4 zip
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: |
          lua5.4 tests/run.lua
          node tests/js/run.js
          node tests/web/run.mjs
      - name: Build
        env:
          PRO_URL: ${{ inputs.pro_url }}
        run: node tools/build_web.mjs
      - name: Browser QA (Chrome)
        env:
          PP_BROWSER_CHANNEL: chrome
        run: node tests/web/e2e.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: free-web-${{ inputs.version }}
          path: |
            dist/web/free/index.html
            dist/web/free/*.zip
          retention-days: 30

  qa-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: free-web-${{ inputs.version }}
          path: dist/web/free
      - name: Browser QA (Edge on Windows)
        env:
          PP_BROWSER_CHANNEL: msedge
        run: node tests/web/e2e.mjs

  publish:
    needs: [build, qa-windows]
    if: ${{ inputs.publish && vars.ITCH_PUBLISH_ENABLED == 'true' && vars.ITCH_FREE_TARGET != '' }}
    runs-on: ubuntu-latest
    environment: itch-free
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: free-web-${{ inputs.version }}
          path: dist/web/free
      - name: Install butler (official itch.io build)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
      - name: Push to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_FREE_TARGET }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo "BUTLER_API_KEY secret missing"; exit 1; }
          mkdir upload && cp dist/web/free/index.html upload/
          ./butler/butler push upload "$ITCH_TARGET" --userversion "$VERSION"
